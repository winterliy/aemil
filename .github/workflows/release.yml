name: Native release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Apple Silicon DMG
        run: ./gradlew :launcher:packageDmg
      - uses: actions/upload-artifact@v4
        with:
          name: aemil-macos-arm64-dmg
          path: launcher/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  windows-exe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows installer
        run: ./gradlew.bat :launcher:packageExe
      - uses: actions/upload-artifact@v4
        with:
          name: aemil-windows-x64-exe
          path: launcher/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [macos-dmg, windows-exe]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: release-assets/*
